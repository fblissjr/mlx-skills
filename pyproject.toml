[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-skills"
version = "0.5.11"
description = "Skills that teach AI coding assistants how MLX works."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.urls]
Repository = "https://github.com/fblissjr/mlx-skills"

[tool.setuptools]
packages = []

[dependency-groups]
dev = [
    "orjson>=3.11.5",
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
